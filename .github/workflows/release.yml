name: Release

# Moves the major version tag (e.g. v1) to each published release, so users of
# @v1 get the latest v1.x.y.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${TAG}' is not of the form vX.Y.Z."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          git push --force origin "${GITHUB_SHA}:refs/tags/${major}"
          echo "Moved ${major} to ${TAG} (${GITHUB_SHA})."
